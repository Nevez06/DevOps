spring.application.name=devops

#Configurações do banco de dados
spring.datasource.url=jdbc:postgresql://localhost:5432/devops_db
spring.datasource.username=postgres
spring.datasource.password=123456

#Atualização automatica do esquema do banco de dados
spring.jpa.hibernate.ddl-auto=update

#Mostrar as consultas SQL no console
spring.jpa.show-sql=true

#Não mostrar as formatações SQL
spring.jpa.properties.hibernate.format_sql=false

#Configurações da porta do servidor
server.port=8080


# Recuperação de senha por email
# Configure estas variáveis no ambiente para enviar email de verdade.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.default-encoding=UTF-8
app.mail.from=${MAIL_FROM:${spring.mail.username}}
app.base-url=${APP_BASE_URL:http://localhost:8080}
