<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Formulário de aluno')}"></head>
<body class="app-body">
    <div class="app-shell">
        <aside th:replace="~{fragments/layout :: appSidebar('aluno')}"></aside>

        <div class="main-area">
            <header th:replace="~{fragments/layout :: appTopbar('aluno')}"></header>

            <main class="page-wrap">
                <section class="hero">
                    <div>
                        <h1>Cadastro de aluno</h1>
                        <p>Preencha os dados para criar ou editar aluno.</p>
                    </div>
                </section>

                <section class="form-card">
                    <h2 class="form-title">Dados do aluno</h2>
                    <form th:action="@{/aluno/salvar}" th:object="${aluno}" method="post">
                        <input type="hidden" th:field="*{idAluno}">

                        <div class="form-grid">
                            <div class="form-group">
                                <label for="nomeAluno">Nome completo</label>
                                <input type="text" id="nomeAluno" th:field="*{nomeAluno}" placeholder="Digite o nome completo" required>
                            </div>

                            <div class="form-group">
                                <label for="emailAluno">E-mail</label>
                                <input type="email" id="emailAluno" th:field="*{emailAluno}" placeholder="exemplo@email.com" required>
                            </div>

                            <div class="form-group">
                                <label for="telefoneAluno">Telefone</label>
                                <input type="text" id="telefoneAluno" th:field="*{telefoneAluno}" placeholder="(00) 90000-0000" data-mask="phone" required>
                            </div>

                            <div class="form-group">
                                <label for="cpfAluno">CPF</label>
                                <input type="text" id="cpfAluno" th:field="*{cpfAluno}" placeholder="000.000.000-00" data-mask="cpf" required>
                            </div>

                            <div class="form-group">
                                <label for="enderecoAluno">Endereço</label>
                                <input type="text" id="enderecoAluno" th:field="*{enderecoAluno}" placeholder="Rua, número, bairro" required>
                            </div>

                            <div class="form-group">
                                <label for="raAluno">RA</label>
                                <input type="text" id="raAluno" th:field="*{raAluno}" placeholder="Digite o RA" required>
                            </div>

                            <div class="form-group form-span-2">
                                <label for="curso">Curso</label>
                                <select id="curso" th:field="*{curso.idCurso}" required>
                                    <option value="">Selecione um curso</option>
                                    <option th:each="curso : ${cursos}" th:value="${curso.idCurso}" th:text="${curso.nomeCurso}">Nome do curso</option>
                                </select>
                            </div>

                            <div class="form-actions">
                                <button type="submit" class="btn btn-success"><i class="bi bi-check2-circle"></i> Salvar aluno</button>
                                <a th:href="@{/home}" class="btn btn-secondary">↩ Voltar</a>
                            </div>
                        </div>
                    </form>
                </section>
            </main>
        </div>
    </div>

    <script th:src="@{/js/mask.js}"></script>
</body>
</html>
