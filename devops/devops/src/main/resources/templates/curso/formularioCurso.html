<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Formulário de curso')}"></head>
<body class="app-body">
    <div class="app-shell">
        <aside th:replace="~{fragments/layout :: appSidebar('curso')}"></aside>

        <div class="main-area">
            <header th:replace="~{fragments/layout :: appTopbar('curso')}"></header>

            <main class="page-wrap">
                <section class="hero">
                    <div>
                        <h1 th:text="${curso.idCurso == null ? 'Novo curso' : 'Editar curso'}">Curso</h1>
                        <p>Preencha os dados do curso.</p>
                    </div>
                </section>

                <section class="form-card">
                    <form th:if="${curso.idCurso == null}" th:action="@{/curso/salvar}" method="post">
                        <h2 class="form-title">Cadastro de curso</h2>
                        <div class="form-grid">
                            <div class="form-group form-span-2">
                                <label for="nomeCurso">Nome do curso</label>
                                <input type="text" id="nomeCurso" name="nomeCurso" th:value="${curso.nomeCurso}" placeholder="Digite o nome do curso" required>
                            </div>

                            <div class="form-group">
                                <label for="periodoCurso">Período</label>
                                <input type="text" id="periodoCurso" name="periodoCurso" th:value="${curso.periodoCurso}" placeholder="Ex: Noturno, Matutino" required>
                            </div>

                            <div class="form-group">
                                <label for="cargahorariaCurso">Carga horária total</label>
                                <input type="text" id="cargahorariaCurso" name="cargahorariaCurso" th:value="${curso.cargahorariaCurso}" placeholder="0000" data-mask="number" required>
                            </div>

                            <div class="form-actions">
                                <button type="submit" class="btn btn-success"><i class="bi bi-check2-circle"></i> Salvar curso</button>
                                <a th:href="@{/home}" class="btn btn-secondary">↩ Voltar</a>
                            </div>
                        </div>
                    </form>

                    <form th:unless="${curso.idCurso == null}" th:action="@{/curso/atualizar/{id}(id=${curso.idCurso})}" method="post">
                        <h2 class="form-title">Edição de curso</h2>
                        <input type="hidden" name="idCurso" th:value="${curso.idCurso}">

                        <div class="form-grid">
                            <div class="form-group form-span-2">
                                <label for="nomeCursoEditar">Nome do curso</label>
                                <input type="text" id="nomeCursoEditar" name="nomeCurso" th:value="${curso.nomeCurso}" placeholder="Digite o nome do curso" required>
                            </div>

                            <div class="form-group">
                                <label for="periodoCursoEditar">Período</label>
                                <input type="text" id="periodoCursoEditar" name="periodoCurso" th:value="${curso.periodoCurso}" placeholder="Ex: Noturno, Matutino" required>
                            </div>

                            <div class="form-group">
                                <label for="cargahorariaCursoEditar">Carga horária total</label>
                                <input type="text" id="cargahorariaCursoEditar" name="cargahorariaCurso" th:value="${curso.cargahorariaCurso}" placeholder="0000" data-mask="number" required>
                            </div>

                            <div class="form-actions">
                                <button type="submit" class="btn btn-success"><i class="bi bi-check2-circle"></i> Atualizar curso</button>
                                <a th:href="@{/home}" class="btn btn-secondary">↩ Voltar</a>
                            </div>
                        </div>
                    </form>
                </section>
            </main>
        </div>
    </div>

    <script th:src="@{/js/mask.js}"></script>
</body>
</html>
