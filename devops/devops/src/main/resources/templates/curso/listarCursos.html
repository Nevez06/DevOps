<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Cursos')}"></head>
<body class="app-body">
    <div class="app-shell">
        <aside th:replace="~{fragments/layout :: appSidebar('curso')}"></aside>

        <div class="main-area">
            <header th:replace="~{fragments/layout :: appTopbar('curso')}"></header>

            <main class="page-wrap">
                <section class="hero">
                    <div>
                        <h1>Cursos</h1>
                        <p>Gerencie os cursos oferecidos pela instituição.</p>
                    </div>
                </section>

                <div th:replace="~{fragments/layout :: alerts(${mensagem}, null)}"></div>

                <section class="panel">
                    <div class="table-toolbar">
                        <div>
                            <h2 class="panel-title" style="font-size:1.24rem;">Lista de cursos</h2>
                            <p class="panel-subtitle">Acompanhe e edite os cursos cadastrados.</p>
                        </div>
                        <div class="table-tools">
                            <div class="search-box">
                                <i class="bi bi-search"></i>
                                <input type="text" placeholder="Buscar curso...">
                            </div>
                            <span class="tool-icon"><i class="bi bi-funnel"></i></span>
                            <a th:href="@{/curso/formulario}" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Novo curso</a>
                        </div>
                    </div>

                    <div class="tabela-wrap">
                        <table class="tabela">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Curso</th>
                                    <th>Período</th>
                                    <th>Carga horária</th>
                                    <th>Status</th>
                                    <th>Ações</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="curso : ${cursos}">
                                    <td th:text="${curso.idCurso}"></td>
                                    <td><strong th:text="${curso.nomeCurso}"></strong></td>
                                    <td th:text="${curso.periodoCurso}"></td>
                                    <td th:text="${curso.cargahorariaCurso} + 'h'"></td>
                                    <td><span class="badge success">Ativo</span></td>
                                    <td>
                                        <div class="acoes">
                                            <a th:href="@{/curso/editar/{id}(id=${curso.idCurso})}" class="action-btn edit" title="Editar"><i class="bi bi-pencil-square"></i></a>
                                            <a th:href="@{/curso/deletar/{id}(id=${curso.idCurso})}" class="action-btn delete" title="Excluir" onclick="return confirm('Tem certeza que deseja deletar?')"><i class="bi bi-trash"></i></a>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(cursos)}"><td colspan="6" class="text-center">Nenhum curso cadastrado.</td></tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="pagination">
                        <small th:text="'Mostrando 1 a ' + ${#lists.size(cursos)} + ' cursos'">Mostrando resultados</small>
                        <div class="pagination-list">
                            <span class="page-btn"><i class="bi bi-chevron-left"></i></span>
                            <span class="page-btn active">1</span>
                            <span class="page-btn">2</span>
                            <span class="page-btn"><i class="bi bi-chevron-right"></i></span>
                        </div>
                    </div>
                </section>

                <div class="text-center mt-2"><a th:href="@{/home}" class="btn btn-secondary">↩ Voltar</a></div>
            </main>
        </div>
    </div>
</body>
</html>
