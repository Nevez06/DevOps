<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Formulário de disciplina')}"></head>
<body class="app-body">
    <div class="app-shell">
        <aside th:replace="~{fragments/layout :: appSidebar('disciplina')}"></aside>

        <div class="main-area">
            <header th:replace="~{fragments/layout :: appTopbar('disciplina')}"></header>

            <main class="page-wrap">
                <section class="hero">
                    <div>
                        <h1 th:text="${disciplina.idDisciplina == null ? 'Nova disciplina' : 'Editar disciplina'}">Disciplina</h1>
                        <p>Preencha os campos para cadastro ou atualização.</p>
                    </div>
                </section>

                <section class="form-card">
                    <form th:if="${disciplina.idDisciplina == null}" th:action="@{/disciplina/salvar}" method="post">
                        <h2 class="form-title">Cadastro de disciplina</h2>
                        <div class="form-grid">
                            <div class="form-group form-span-2">
                                <label for="nomeDisciplina">Nome da disciplina</label>
                                <input type="text" id="nomeDisciplina" name="nomeDisciplina" th:value="${disciplina.nomeDisciplina}" placeholder="Digite o nome da disciplina" required>
                            </div>

                            <div class="form-group">
                                <label for="siglaDisciplina">Sigla</label>
                                <input type="text" id="siglaDisciplina" name="siglaDisciplina" th:value="${disciplina.siglaDisciplina}" placeholder="Ex: POO, BD" required>
                            </div>

                            <div class="form-group">
                                <label for="cargaHorariaDisciplina">Carga horária</label>
                                <input type="text" id="cargaHorariaDisciplina" name="cargaHorariaDisciplina" th:value="${disciplina.cargaHorariaDisciplina}" placeholder="0000" data-mask="number" required>
                            </div>

                            <div class="form-group">
                                <label for="idProfessor">ID do professor</label>
                                <input type="text" id="idProfessor" name="idProfessor" th:value="${disciplina.idProfessor}" placeholder="0000" data-mask="number" required>
                            </div>

                            <div class="form-group">
                                <label for="idCurso">ID do curso</label>
                                <input type="text" id="idCurso" name="idCurso" th:value="${disciplina.idCurso}" placeholder="0000" data-mask="number" required>
                            </div>

                            <div class="form-actions">
                                <button type="submit" class="btn btn-success"><i class="bi bi-check2-circle"></i> Salvar disciplina</button>
                                <a th:href="@{/home}" class="btn btn-secondary">↩ Voltar</a>
                            </div>
                        </div>
                    </form>

                    <form th:unless="${disciplina.idDisciplina == null}" th:action="@{/disciplina/atualizar/{id}(id=${disciplina.idDisciplina})}" method="post">
                        <h2 class="form-title">Edição de disciplina</h2>
                        <input type="hidden" name="idDisciplina" th:value="${disciplina.idDisciplina}">

                        <div class="form-grid">
                            <div class="form-group form-span-2">
                                <label for="nomeDisciplinaEditar">Nome da disciplina</label>
                                <input type="text" id="nomeDisciplinaEditar" name="nomeDisciplina" th:value="${disciplina.nomeDisciplina}" placeholder="Digite o nome da disciplina" required>
                            </div>

                            <div class="form-group">
                                <label for="siglaDisciplinaEditar">Sigla</label>
                                <input type="text" id="siglaDisciplinaEditar" name="siglaDisciplina" th:value="${disciplina.siglaDisciplina}" placeholder="Ex: POO, BD" required>
                            </div>

                            <div class="form-group">
                                <label for="cargaHorariaDisciplinaEditar">Carga horária</label>
                                <input type="text" id="cargaHorariaDisciplinaEditar" name="cargaHorariaDisciplina" th:value="${disciplina.cargaHorariaDisciplina}" placeholder="0000" data-mask="number" required>
                            </div>

                            <div class="form-group">
                                <label for="idProfessorEditar">ID do professor</label>
                                <input type="text" id="idProfessorEditar" name="idProfessor" th:value="${disciplina.idProfessor}" placeholder="0000" data-mask="number" required>
                            </div>

                            <div class="form-group">
                                <label for="idCursoEditar">ID do curso</label>
                                <input type="text" id="idCursoEditar" name="idCurso" th:value="${disciplina.idCurso}" placeholder="0000" data-mask="number" required>
                            </div>

                            <div class="form-actions">
                                <button type="submit" class="btn btn-success"><i class="bi bi-check2-circle"></i> Atualizar disciplina</button>
                                <a th:href="@{/home}" class="btn btn-secondary">↩ Voltar</a>
                            </div>
                        </div>
                    </form>
                </section>
            </main>
        </div>
    </div>

    <script th:src="@{/js/mask.js}"></script>
</body>
</html>
