<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Disciplinas')}"></head>
<body class="app-body">
    <div class="app-shell">
        <aside th:replace="~{fragments/layout :: appSidebar('disciplina')}"></aside>

        <div class="main-area">
            <header th:replace="~{fragments/layout :: appTopbar('disciplina')}"></header>

            <main class="page-wrap">
                <section class="hero">
                    <div>
                        <h1>Disciplinas</h1>
                        <p>Gerencie disciplinas oferecidas nos cursos.</p>
                    </div>
                </section>

                <div th:replace="~{fragments/layout :: alerts(${mensagem}, null)}"></div>

                <section class="panel">
                    <div class="table-toolbar">
                        <div>
                            <h2 class="panel-title" style="font-size:1.24rem;">Lista de disciplinas</h2>
                            <p class="panel-subtitle">Visualize disciplinas e vínculos com curso e professor.</p>
                        </div>
                        <div class="table-tools">
                            <div class="search-box"><i class="bi bi-search"></i><input type="text" placeholder="Buscar disciplina..."></div>
                            <span class="tool-icon"><i class="bi bi-funnel"></i></span>
                            <a th:href="@{/disciplina/formulario}" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Nova disciplina</a>
                        </div>
                    </div>

                    <div class="tabela-wrap">
                        <table class="tabela">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Nome</th>
                                    <th>Sigla</th>
                                    <th>Carga horária</th>
                                    <th>ID Professor</th>
                                    <th>ID Curso</th>
                                    <th>Ações</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="disciplina : ${disciplinas}">
                                    <td th:text="${disciplina.idDisciplina}"></td>
                                    <td><strong th:text="${disciplina.nomeDisciplina}"></strong></td>
                                    <td th:text="${disciplina.siglaDisciplina}"></td>
                                    <td th:text="${disciplina.cargaHorariaDisciplina} + 'h'"></td>
                                    <td th:text="${disciplina.idProfessor}"></td>
                                    <td th:text="${disciplina.idCurso}"></td>
                                    <td>
                                        <div class="acoes">
                                            <a th:href="@{/disciplina/editar/{id}(id=${disciplina.idDisciplina})}" class="action-btn edit" title="Editar"><i class="bi bi-pencil-square"></i></a>
                                            <a th:href="@{/disciplina/deletar/{id}(id=${disciplina.idDisciplina})}" class="action-btn delete" title="Excluir" onclick="return confirm('Tem certeza que deseja deletar?')"><i class="bi bi-trash"></i></a>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(disciplinas)}"><td colspan="7" class="text-center">Nenhuma disciplina cadastrada.</td></tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="pagination">
                        <small th:text="'Mostrando 1 a ' + ${#lists.size(disciplinas)} + ' disciplinas'">Mostrando resultados</small>
                        <div class="pagination-list">
                            <span class="page-btn"><i class="bi bi-chevron-left"></i></span>
                            <span class="page-btn active">1</span>
                            <span class="page-btn">2</span>
                            <span class="page-btn"><i class="bi bi-chevron-right"></i></span>
                        </div>
                    </div>
                </section>

                <div class="text-center mt-2"><a th:href="@{/home}" class="btn btn-secondary">↩ Voltar</a></div>
            </main>
        </div>
    </div>
</body>
</html>
