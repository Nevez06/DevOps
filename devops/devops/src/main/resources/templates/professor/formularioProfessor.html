<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Formulário de professor')}"></head>
<body class="app-body">
    <div class="app-shell">
        <aside th:replace="~{fragments/layout :: appSidebar('professor')}"></aside>

        <div class="main-area">
            <header th:replace="~{fragments/layout :: appTopbar('professor')}"></header>

            <main class="page-wrap">
                <section class="hero">
                    <div>
                        <h1 th:text="${professor.idProfessor == null ? 'Novo professor' : 'Editar professor'}">Professor</h1>
                        <p>Preencha os dados para cadastro ou edição.</p>
                    </div>
                </section>

                <section class="form-card">
                    <form th:if="${professor.idProfessor == null}" th:action="@{/professor/salvar}" method="post">
                        <h2 class="form-title">Cadastro de professor</h2>
                        <div class="form-grid">
                            <div class="form-group form-span-2">
                                <label for="nomeProfessor">Nome completo</label>
                                <input type="text" id="nomeProfessor" name="nomeProfessor" th:value="${professor.nomeProfessor}" placeholder="Digite o nome completo" required>
                            </div>

                            <div class="form-group">
                                <label for="telefoneProfessor">Telefone</label>
                                <input type="text" id="telefoneProfessor" name="telefoneProfessor" th:value="${professor.telefoneProfessor}" placeholder="(00) 90000-0000" data-mask="phone" required>
                            </div>

                            <div class="form-group">
                                <label for="rmProfessor">RM</label>
                                <input type="text" id="rmProfessor" name="rmProfessor" th:value="${professor.rmProfessor}" placeholder="00000-0" data-mask="rm" required>
                            </div>

                            <div class="form-group form-span-2">
                                <label for="graduacaoProfessor">Graduação</label>
                                <input type="text" id="graduacaoProfessor" name="graduacaoProfessor" th:value="${professor.graduacaoProfessor}" placeholder="Ex: Mestrado em Computação" required>
                            </div>

                            <div class="form-actions">
                                <button type="submit" class="btn btn-success"><i class="bi bi-check2-circle"></i> Salvar professor</button>
                                <a th:href="@{/home}" class="btn btn-secondary">↩ Voltar</a>
                            </div>
                        </div>
                    </form>

                    <form th:unless="${professor.idProfessor == null}" th:action="@{/professor/atualizar/{id}(id=${professor.idProfessor})}" method="post">
                        <h2 class="form-title">Edição de professor</h2>
                        <input type="hidden" name="idProfessor" th:value="${professor.idProfessor}">

                        <div class="form-grid">
                            <div class="form-group form-span-2">
                                <label for="nomeProfessorEditar">Nome completo</label>
                                <input type="text" id="nomeProfessorEditar" name="nomeProfessor" th:value="${professor.nomeProfessor}" placeholder="Digite o nome completo" required>
                            </div>

                            <div class="form-group">
                                <label for="telefoneProfessorEditar">Telefone</label>
                                <input type="text" id="telefoneProfessorEditar" name="telefoneProfessor" th:value="${professor.telefoneProfessor}" placeholder="(00) 90000-0000" data-mask="phone" required>
                            </div>

                            <div class="form-group">
                                <label for="rmProfessorEditar">RM</label>
                                <input type="text" id="rmProfessorEditar" name="rmProfessor" th:value="${professor.rmProfessor}" placeholder="00000-0" data-mask="rm" required>
                            </div>

                            <div class="form-group form-span-2">
                                <label for="graduacaoProfessorEditar">Graduação</label>
                                <input type="text" id="graduacaoProfessorEditar" name="graduacaoProfessor" th:value="${professor.graduacaoProfessor}" placeholder="Ex: Mestrado em Computação" required>
                            </div>

                            <div class="form-actions">
                                <button type="submit" class="btn btn-success"><i class="bi bi-check2-circle"></i> Atualizar professor</button>
                                <a th:href="@{/home}" class="btn btn-secondary">↩ Voltar</a>
                            </div>
                        </div>
                    </form>
                </section>
            </main>
        </div>
    </div>

    <script th:src="@{/js/mask.js}"></script>
</body>
</html>
