<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Recuperar senha')}"></head>
<body class="auth-page">
    <nav th:replace="~{fragments/layout :: publicNav}"></nav>

    <main class="auth-layout">
        <section class="auth-brand">
            <div>
                <span class="auth-badge">Recuperação de acesso</span>
                <h1>Solicite um link para redefinir sua senha</h1>
                <p>Informe seu e-mail cadastrado e enviaremos um link seguro com validade de 30 minutos.</p>
                <ul class="auth-list">
                    <li><i class="bi bi-envelope-check"></i> E-mail enviado via Resend</li>
                    <li><i class="bi bi-hourglass-split"></i> Token com expiração automática</li>
                    <li><i class="bi bi-key"></i> Processo protegido e auditável</li>
                </ul>
            </div>
        </section>

        <section class="auth-panel">
            <form th:action="@{/recuperar-senha}" method="post">
                <h2 class="form-title">Recuperar senha</h2>

                <div class="alert alert-success" th:if="${mensagem}" th:text="${mensagem}"></div>
                <div class="alert alert-danger" th:if="${erro}" th:text="${erro}"></div>

                <div class="form-grid">
                    <div class="form-group form-span-2">
                        <label for="email">E-mail cadastrado</label>
                        <input type="email" id="email" name="email" placeholder="exemplo@email.com" required autofocus>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary"><i class="bi bi-send"></i> Enviar link de recuperação</button>
                    <a th:href="@{/login}" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> Voltar ao login</a>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
