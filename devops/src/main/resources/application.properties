spring.application.name=nevez-campus

#Configurações do banco de dados
spring.datasource.url=jdbc:h2:file:./data/nevez-campus;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=

#Atualização automatica do esquema do banco de dados
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

#Mostrar as consultas SQL no console
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

#Não mostrar as formatações SQL
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Limites para upload das fotos dos produtos
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

#Configurações da porta do servidor
server.port=8080
app.base-url=${APP_BASE_URL:http://localhost:${server.port}}
# Desabilita a página Whitelabel do Spring Boot para usar nossa `error.html`
server.error.whitelabel.enabled=false
#Configurações de Email (Gmail)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Usuários fictícios somente mediante ativação explícita e senhas no ambiente
app.bootstrap.enabled=${APP_BOOTSTRAP_ENABLED:false}
app.bootstrap.admin-password=${APP_ADMIN_PASSWORD:}
app.bootstrap.professor-password=${APP_PROFESSOR_PASSWORD:}
app.bootstrap.secretaria-password=${APP_SECRETARIA_PASSWORD:}
