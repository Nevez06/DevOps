<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Alunos')}"></head>
<body class="app-body">
    <div class="app-shell">
        <aside th:replace="~{fragments/layout :: appSidebar('aluno')}"></aside>

        <div class="main-area">
            <header th:replace="~{fragments/layout :: appTopbar('aluno')}"></header>

            <main class="page-wrap">
                <section class="hero">
                    <div>
                        <h1>Alunos</h1>
                        <p>Gerencie os alunos cadastrados no sistema.</p>
                    </div>
                </section>

                <section class="panel">
                    <div class="table-toolbar">
                        <div>
                            <h2 class="panel-title" style="font-size:1.24rem;">Lista de alunos</h2>
                            <p class="panel-subtitle">Visualize, edite e acompanhe os registros acadêmicos.</p>
                        </div>
                        <div class="table-tools">
                            <div class="search-box">
                                <i class="bi bi-search"></i>
                                <input type="text" placeholder="Buscar aluno...">
                            </div>
                            <span class="tool-icon"><i class="bi bi-funnel"></i></span>
                            <a class="btn btn-primary" th:href="@{/aluno/formulario}"><i class="bi bi-plus-lg"></i> Novo aluno</a>
                        </div>
                    </div>

                    <div class="tabela-wrap">
                        <table class="tabela">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Nome</th>
                                    <th>E-mail</th>
                                    <th>Telefone</th>
                                    <th>Curso</th>
                                    <th>Status</th>
                                    <th>Ações</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="aluno : ${alunos}">
                                    <td th:text="${aluno.idAluno}">1</td>
                                    <td>
                                        <strong th:text="${aluno.nomeAluno}">Nome</strong>
                                        <div class="row-muted" th:text="${aluno.raAluno}">RA</div>
                                    </td>
                                    <td th:text="${aluno.emailAluno}">email@email.com</td>
                                    <td th:text="${aluno.telefoneAluno}">(00) 00000-0000</td>
                                    <td th:text="${aluno.curso != null ? aluno.curso.nomeCurso : 'Sem curso'}">Curso</td>
                                    <td><span class="badge success">Ativo</span></td>
                                    <td>
                                        <div class="acoes">
                                            <a class="action-btn edit" title="Editar" th:href="@{/aluno/editar/{id}(id=${aluno.idAluno})}"><i class="bi bi-pencil-square"></i></a>
                                            <a class="action-btn delete" title="Excluir" th:href="@{/aluno/deletar/{id}(id=${aluno.idAluno})}" onclick="return confirm('Tem certeza que deseja excluir este aluno?');"><i class="bi bi-trash"></i></a>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(alunos)}">
                                    <td colspan="7" class="text-center">Nenhum aluno cadastrado.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="pagination">
                        <small th:text="'Mostrando 1 a ' + ${#lists.size(alunos)} + ' alunos'">Mostrando resultados</small>
                        <div class="pagination-list">
                            <span class="page-btn"><i class="bi bi-chevron-left"></i></span>
                            <span class="page-btn active">1</span>
                            <span class="page-btn">2</span>
                            <span class="page-btn">3</span>
                            <span class="page-btn"><i class="bi bi-chevron-right"></i></span>
                        </div>
                    </div>
                </section>

                <div class="text-center mt-2">
                    <a th:href="@{/home}" class="btn btn-secondary">↩ Voltar</a>
                </div>
            </main>
        </div>
    </div>
</body>
</html>
