<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Redefinir senha')}"></head>
<body class="auth-page">
    <nav th:replace="~{fragments/layout :: publicNav}"></nav>

    <main class="auth-layout">
        <section class="auth-brand">
            <div>
                <span class="auth-badge">Nova senha</span>
                <h1>Defina sua nova senha e retome o acesso</h1>
                <p>Preencha os campos abaixo para concluir a recuperação com segurança.</p>
                <ul class="auth-list">
                    <li><i class="bi bi-check2-circle"></i> Validação de token antes da troca</li>
                    <li><i class="bi bi-lock"></i> Senha criptografada com BCrypt</li>
                    <li><i class="bi bi-shield-check"></i> Token invalidado após uso</li>
                </ul>
            </div>
        </section>

        <section class="auth-panel">
            <form th:action="@{/redefinir-senha}" method="post">
                <h2 class="form-title">Criar nova senha</h2>
                <input type="hidden" name="token" th:value="${token}">

                <div class="alert alert-danger" th:if="${erro}" th:text="${erro}"></div>

                <div class="form-grid">
                    <div class="form-group form-span-2">
                        <label for="senha">Nova senha</label>
                        <input type="password" id="senha" name="senha" placeholder="Mínimo 6 caracteres" minlength="6" required autofocus>
                    </div>

                    <div class="form-group form-span-2">
                        <label for="confirmarSenha">Confirmar nova senha</label>
                        <input type="password" id="confirmarSenha" name="confirmarSenha" placeholder="Repita a senha" minlength="6" required>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary"><i class="bi bi-check2-circle"></i> Salvar nova senha</button>
                    <a th:href="@{/login}" class="btn btn-secondary"><i class="bi bi-x-circle"></i> Cancelar</a>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
