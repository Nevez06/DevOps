<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Usuários')}"></head>
<body class="app-body">
    <div class="app-shell">
        <aside th:replace="~{fragments/layout :: appSidebar('usuario')}"></aside>

        <div class="main-area">
            <header th:replace="~{fragments/layout :: appTopbar('usuario')}"></header>

            <main class="page-wrap">
                <section class="hero">
                    <div>
                        <h1>Usuários</h1>
                        <p>Controle os acessos e perfis cadastrados no sistema.</p>
                    </div>
                </section>

                <div th:replace="~{fragments/layout :: alerts(${mensagem}, null)}"></div>

                <section class="panel">
                    <div class="table-toolbar">
                        <div>
                            <h2 class="panel-title" style="font-size:1.24rem;">Lista de usuários</h2>
                            <p class="panel-subtitle">Gerencie credenciais e perfis de acesso.</p>
                        </div>
                        <div class="table-tools">
                            <div class="search-box"><i class="bi bi-search"></i><input type="text" placeholder="Buscar usuário..."></div>
                            <span class="tool-icon"><i class="bi bi-funnel"></i></span>
                            <a th:href="@{/usuario/formulario}" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Novo usuário</a>
                        </div>
                    </div>

                    <div class="tabela-wrap">
                        <table class="tabela">
                            <thead>
                                <tr>
                                    <th>Nome</th>
                                    <th>E-mail</th>
                                    <th>Login</th>
                                    <th>Role</th>
                                    <th>Status</th>
                                    <th>Ações</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="usuario : ${usuarios}">
                                    <td><strong th:text="${usuario.nomeUsuario}"></strong></td>
                                    <td th:text="${usuario.emailUsuario}"></td>
                                    <td th:text="${usuario.loginUsuario}"></td>
                                    <td><span class="badge warning" th:text="${usuario.roleUsuario}">ROLE</span></td>
                                    <td><span class="badge success">Ativo</span></td>
                                    <td>
                                        <div class="acoes">
                                            <a th:href="@{/usuario/editar/{id}(id=${usuario.idUsuario})}" class="action-btn edit" title="Editar"><i class="bi bi-pencil-square"></i></a>
                                            <a th:href="@{/usuario/deletar/{id}(id=${usuario.idUsuario})}" class="action-btn delete" title="Excluir" onclick="return confirm('Deseja realmente excluir este usuário?')"><i class="bi bi-trash"></i></a>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(usuarios)}"><td colspan="6" class="text-center">Nenhum usuário cadastrado.</td></tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="pagination">
                        <small th:text="'Mostrando 1 a ' + ${#lists.size(usuarios)} + ' usuários'">Mostrando resultados</small>
                        <div class="pagination-list">
                            <span class="page-btn"><i class="bi bi-chevron-left"></i></span>
                            <span class="page-btn active">1</span>
                            <span class="page-btn">2</span>
                            <span class="page-btn"><i class="bi bi-chevron-right"></i></span>
                        </div>
                    </div>
                </section>

                <div class="text-center mt-2"><a th:href="@{/home}" class="btn btn-secondary">↩ Voltar</a></div>
            </main>
        </div>
    </div>
</body>
</html>
